<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bekçi · saha kontrol</title>
<!--
  Canlı demo arayüzü, SCADA tasarımı (27.11.2026; karar: endüstriyel SCADA paneli, koyu zemin, sahne başında anlatım kartı
  sonra kontrol odası, model zihni yerine kadran).
  Veri: /api/runs/{id}/timeline (kayıtlı oynatmanın sahneli zaman çizelgesi; kurallar timeline_dnn_edgeiiot.py'de).
  Gösterim kuralları:
    - P&ID şeması: cihaz → toplama hattı → BEKÇİ ünitesi → karara göre çıkış: NORMAL → ŞEBEKE, SALDIRI → KARANTİNA,
      ALARM/KONTROL → ANALİST. Yoğun kaynaklar sunucuda seyreltilmiştir (NORMAL dışı kararlar hep çizilir); sayaçlar ve
      tank seviyeleri tam sayılardan gelir. Kayıt zamanı sıkıştırılmıştır (sıra ve kararlar aynı).
    - Model kadranı (şematik): ibre son paketlerin konumunun yumuşatılmış ağırlıklı ortalamasıdır (NORMAL dışı kararlar 6 kat
      ağırlıklı). NORMAL yeşil dilimde (enerji eşikten ne kadar uzaksa o kadar solda), KONTROL camgöbeği dilimde, SALDIRI
      turuncu dilimde, ALARM kırmızı dilimde (anlaşmazlık eşiği ne kadar aşarsa o kadar sağda). Bir izdüşüm değildir.
    - Anons paneli: son 5 sn'deki kararlar ve kayma göstergesi (eşikler sunucuda).
    - Analist konsolu: sahnedeki son "tanımıyorum / emin değilim" bağlantısı; kararlar alerts.status'a yazılır.
  window.BEKCI_SAMPLE tanımlıysa (önizleme) API yerine onu kullanır, kararlar yalnız ekranda kalır.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/*
  VOICE   tesis kontrol odası: ağırbaşlı, net, alarmlar keskin
  IDEA    P&ID boru şeması + anons paneli + analog kadran (gerçek SCADA operatör ekranı)
  PICTURE paketler borularda akıyor; Bekçi ayırıcı ünitesi onları üç çıkışa yönlendiriyor
  COLOUR  antrasit zemin; çalışan = yeşil, bilinen saldırı = turuncu, emin değil = camgöbeği, tanımadığı = kırmızı, tehlike sarısı
  TYPE    Barlow Condensed (etiket plakaları), Barlow (metin), Share Tech Mono (sayaç ekranları)
*/
:root{--bg:#0D1012;--panel:#14181B;--panel2:#191E22;--edge:#2A3137;--edge2:#3A434B;--steel:#55606A;--ink:#E4E8EB;--ink2:#A9B3BB;
  --mute:#7E8992;--ok:#3DDC84;--known:#FF9F1C;--chk:#3EC6E0;--alm:#FF4D3D;--haz:#F2C230;--lcd:#0A1A12;--lcdink:#7CF5A8}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'Barlow',system-ui,sans-serif}
.mono{font-family:'Share Tech Mono',ui-monospace,monospace}
.wrap{max-width:1500px;margin:0 auto;padding:16px 18px 28px;display:flex;flex-direction:column;gap:14px}
button{font-family:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--haz);outline-offset:2px}
.hazard{height:8px;border-radius:2px;background:repeating-linear-gradient(-45deg,var(--haz) 0 12px,#111 12px 24px)}
.hazard.anim{animation:haz 1s linear infinite;background-size:34px 34px}
@keyframes haz{to{background-position:34px 0}}
.top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px 22px;align-items:center}
.plate{display:flex;align-items:center;gap:12px;padding:8px 14px 8px 10px;border:1px solid var(--edge2);border-radius:6px;background:linear-gradient(#20262B,#171B1F);box-shadow:inset 0 1px 0 #3a434b}
.plate b{font:800 26px/1 'Barlow Condensed';letter-spacing:.06em}
.plate small{display:block;font:600 12px/1.2 'Barlow Condensed';letter-spacing:.14em;color:var(--mute)}
.bolt{width:7px;height:7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#9aa5ad,#3b444b);box-shadow:0 0 0 1px #0007}
.runline{font:600 14px 'Barlow Condensed';letter-spacing:.06em;color:var(--ink2)}
.runline b{color:var(--alm)}
.lcds{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.lcd{background:var(--lcd);border:1px solid #1f3a2b;border-radius:5px;padding:6px 10px;min-width:120px;box-shadow:inset 0 2px 8px #000a}
.lcd .v{font:26px/1 'Share Tech Mono';color:var(--lcdink);text-shadow:0 0 8px #7cf5a855;text-align:right}
.lcd .k{font:600 11px/1.2 'Barlow Condensed';letter-spacing:.12em;color:#5f8f73;text-transform:uppercase}
.lcd.amber .v{color:#FFC266;text-shadow:0 0 8px #ffb34755}.lcd.amber{background:#1A1206;border-color:#3d2b10}.lcd.amber .k{color:#a07a3c}
.lcd.red .v{color:#FF8A7E;text-shadow:0 0 8px #ff4d3d66}.lcd.red{background:#1C0B09;border-color:#46201b}.lcd.red .k{color:#a85a52}
.ctl{display:flex;gap:8px;align-items:center}
.sw{min-height:44px;min-width:44px;border-radius:6px;border:1px solid var(--edge2);background:linear-gradient(#262d33,#1a1f23);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0 10px;font:700 13px 'Barlow Condensed';letter-spacing:.08em}
select.sw{appearance:none;padding:0 12px}
.grid{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:14px}
.panel{background:var(--panel);border:1px solid var(--edge);border-radius:8px;position:relative;display:flex;flex-direction:column}
.panel>h2{margin:0;padding:9px 14px;border-bottom:1px solid var(--edge);display:flex;justify-content:space-between;align-items:center;gap:10px;font:700 14px/1.2 'Barlow Condensed';letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);background:linear-gradient(#1A1F23,#15191C);border-radius:8px 8px 0 0}
.panel>h2 .tag{font:12px 'Share Tech Mono';color:var(--mute);letter-spacing:.02em;text-transform:none}
.body{padding:12px 14px}
.scenebar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:0 14px 12px}
.scn{min-height:46px;border-radius:6px;border:1px solid var(--edge2);background:#171C20;color:var(--mute);font:700 14px 'Barlow Condensed';letter-spacing:.06em;text-align:left;padding:6px 10px;display:flex;align-items:center;gap:8px}
.scn i{width:10px;height:10px;border-radius:50%;background:#2d353b;flex:none;box-shadow:inset 0 1px 2px #000}
.scn.on{color:var(--ink);border-color:var(--haz);background:#1F1D12}.scn.on i{background:var(--haz);box-shadow:0 0 10px var(--haz)}
.scn.done i{background:var(--steel)}
.track{height:6px;margin:0 14px 12px;border-radius:3px;background:#1E2428;overflow:hidden}
.track b{display:block;height:100%;width:0;background:var(--haz)}
.note{font-size:12.5px;color:var(--mute);padding:0 14px 12px}
.ann{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.lamp{min-height:56px;border-radius:4px;border:1px solid #2a3035;background:#1a1e21;color:#59636b;font:700 12.5px/1.15 'Barlow Condensed';letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;box-shadow:inset 0 2px 6px #000a}
.lamp.on{color:#1a0f0d;box-shadow:0 0 18px var(--c),inset 0 0 10px #fff6;background:var(--c);border-color:var(--c)}
.lamp.on.flash{animation:flash .7s steps(2,start) infinite}
@keyframes flash{50%{background:#1a1e21;color:#59636b;box-shadow:inset 0 2px 6px #000a}}
.meter{display:grid;grid-template-columns:136px minmax(0,1fr) 62px;gap:10px;align-items:center;margin:6px 0;font:600 13.5px 'Barlow Condensed';letter-spacing:.04em}
.meter .bar{height:16px;border-radius:3px;background:#0c0f11;border:1px solid #262c31;position:relative;overflow:hidden}
.meter .bar i{position:absolute;inset:0 auto 0 0;transition:width .35s}
.meter .bar u{position:absolute;top:0;bottom:0;width:2px;background:var(--alm);box-shadow:0 0 6px var(--alm)}
.meter .bar s{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9%,#ffffff10 9% 10%)}
.log{font:13px/1.35 'Share Tech Mono';display:flex;flex-direction:column;gap:3px}
.log div{display:grid;grid-template-columns:52px 64px minmax(0,1fr) 104px;gap:10px;padding:5px 8px;border-left:3px solid var(--c);background:#171B1E;border-radius:0 3px 3px 0;align-items:center}
.log span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log .st{color:var(--c);text-align:right}
.wo{border:1px solid var(--edge2);border-radius:6px;background:var(--panel2);overflow:hidden}
.wo .hd{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--edge)}
.badge{font:800 13px/1 'Barlow Condensed';letter-spacing:.1em;padding:6px 9px;border-radius:3px;color:#111;background:var(--c)}
.wo h3{margin:0;padding:12px 12px 4px;font:700 24px/1.15 'Barlow Condensed';letter-spacing:.01em}
.wo p{margin:0;padding:0 12px 10px;color:var(--ink2)}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:0 12px 12px}
.kv div{background:#0F1214;border:1px solid #23292e;border-radius:4px;padding:7px 9px}
.kv .n{font:22px/1 'Share Tech Mono';color:var(--ink)}
.kv .t{font:600 11.5px/1.2 'Barlow Condensed';letter-spacing:.08em;color:var(--mute);text-transform:uppercase;margin-top:3px}
.xai{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:0 12px 12px}
.xai div{border:1px dashed #39424a;border-radius:4px;padding:8px 10px;font-size:13px;color:var(--mute)}
.xai b{display:block;font:700 12px 'Barlow Condensed';letter-spacing:.12em;color:var(--ink2);text-transform:uppercase;margin-bottom:3px}
.acts{display:flex;gap:8px;flex-wrap:wrap;padding:0 12px 12px}
.act{min-height:46px;padding:0 16px;border-radius:5px;font:700 15px 'Barlow Condensed';letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--edge2);background:#1d2327;color:var(--ink)}
.act.pri{background:var(--alm);border-color:var(--alm);color:#160604}
.act.ok{background:var(--ok);border-color:var(--ok);color:#06180d}
.done{padding:10px 12px 12px;font:700 15px 'Barlow Condensed';letter-spacing:.06em;color:var(--ok)}
.intro{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#05070acc;backdrop-filter:blur(3px);z-index:5;padding:20px}
.intro.on{display:flex;animation:fade .35s ease both}
@keyframes fade{from{opacity:0}}
.card{width:min(860px,100%);background:#15191C;border:1px solid var(--edge2);border-radius:10px;overflow:hidden;box-shadow:0 30px 80px #000c;animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{transform:translateY(24px) scale(.98);opacity:0}}
.card .in{padding:26px 30px 24px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 24px;align-items:start}
.card .num{font:800 110px/0.85 'Barlow Condensed';color:var(--c)}
.card h1{margin:4px 0 6px;font:800 44px/1.02 'Barlow Condensed';letter-spacing:.01em;text-wrap:balance}
.card p{margin:0 0 6px;font-size:17px;color:var(--ink2);max-width:60ch}
.card .facts{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.card .facts div{background:#0F1214;border:1px solid #262c31;border-radius:5px;padding:10px 12px}
.card .facts .n{font:30px/1 'Share Tech Mono';color:var(--c)}
.card .facts .t{font:600 12.5px/1.25 'Barlow Condensed';letter-spacing:.06em;color:var(--mute);text-transform:uppercase;margin-top:4px}
.card .go{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;margin-top:10px;font:600 13px 'Barlow Condensed';letter-spacing:.08em;color:var(--mute)}
.card .go .bar{flex:1;height:4px;margin-right:14px;background:#222a30;border-radius:2px;overflow:hidden}
.card .go .bar i{display:block;height:100%;width:0;background:var(--c)}
.err{padding:14px;border-radius:6px;background:#2a1210;border:1px solid #6b2a22;color:#ffd6cf;display:none}
@media (max-width:1100px){.grid{grid-template-columns:minmax(0,1fr)}.top{grid-template-columns:minmax(0,1fr)}.lcds{justify-content:flex-start}}
@media (max-width:640px){.scenebar,.ann{grid-template-columns:repeat(2,minmax(0,1fr))}.kv{grid-template-columns:repeat(2,minmax(0,1fr))}.log div{grid-template-columns:48px minmax(0,1fr) 86px}.log div span:nth-child(2){display:none}.card .facts{grid-template-columns:minmax(0,1fr)}.card .num{font-size:70px}.card h1{font-size:32px}}
.flow{stroke-dasharray:3 13;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-32}}
.blink{animation:flash .9s steps(2,start) infinite}
@media (prefers-reduced-motion:reduce){.hazard.anim,.lamp.on.flash,.flow,.blink{animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="plate"><span class="bolt"></span>
      <div><b>BEKÇİ</b><small>SAHA KONTROL · IIoT SALDIRI TESPİTİ</small></div><span class="bolt"></span></div>
    <div class="runline" id="runInfo">bağlanıyor…</div>
    <div class="lcds">
      <div class="lcd"><div class="v" id="nPkt">0</div><div class="k">paket incelendi</div></div>
      <div class="lcd amber"><div class="v" id="nBlk">0</div><div class="k">bağlantı karantinada</div></div>
      <div class="lcd red"><div class="v" id="nAn">0</div><div class="k">bağlantı analiste</div></div>
      <div class="ctl">
        <select class="sw" id="speed" aria-label="Oynatma hızı"><option value="0.5">0,5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
        <button class="sw" id="play" aria-label="Duraklat"></button>
      </div>
    </div>
  </div>
  <div class="hazard" id="hz"></div>
  <div class="err" id="error"></div>

  <div class="grid">
    <section class="panel" aria-labelledby="h-pid">
      <h2 id="h-pid">Tesis şeması · P&amp;ID <span class="tag" id="clock">00:00</span></h2>
      <svg id="pid" viewBox="0 0 920 500" style="width:100%;height:auto;display:block" role="img" aria-label="Tesis boru şeması: cihazlar, Bekçi ayırıcı ünitesi ve üç çıkış (şebeke, karantina, analist)"></svg>
      <div class="scenebar" id="scenes"></div>
      <div class="track"><b id="prog"></b></div>
      <div class="note" id="compress"></div>
    </section>

    <div style="display:flex;flex-direction:column;gap:14px">
      <section class="panel" aria-labelledby="h-dial">
        <h2 id="h-dial">Model kadranı <span class="tag">şematik · izdüşüm değil</span></h2>
        <div class="body" style="padding-bottom:6px">
          <svg id="dial" viewBox="0 0 400 236" style="width:100%;height:auto;display:block" role="img" aria-label="Kadran: ibre normalden bilinmeyene doğru sapıyor"></svg>
          <div id="mix" style="display:flex;height:12px;border-radius:2px;overflow:hidden;background:#0c0f11;border:1px solid #262c31"></div>
          <div class="mono" id="mixTxt" style="font-size:12.5px;color:var(--mute);margin-top:6px">son 5 sn</div>
        </div>
      </section>
      <section class="panel" aria-labelledby="h-ann">
        <h2 id="h-ann">Anons paneli <span class="tag">son 5 sn</span></h2>
        <div class="body">
          <div class="ann" id="ann"></div>
          <div style="margin-top:12px">
            <div class="meter"><span>ANALİSTE GİDEN</span><div class="bar"><s></s><i id="gA" style="background:var(--alm)"></i><u id="tA"></u></div><span class="mono" id="vA">%0</span></div>
            <div class="meter"><span id="lN">YENİ TRAFİK</span><div class="bar"><s></s><i id="gN" style="background:var(--chk)"></i><u id="tN"></u></div><span class="mono" id="vN">%0</span></div>
            <div class="note" id="driftNote" style="padding:4px 0 0"></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <div class="grid">
    <section class="panel" aria-labelledby="h-log">
      <h2 id="h-log">Olay günlüğü <span class="tag">bağlantı düzeyi</span></h2>
      <div class="body"><div class="log" id="log"></div></div>
    </section>
    <section class="panel" aria-labelledby="h-wo">
      <h2 id="h-wo">Analist konsolu <span class="tag" id="woCount"></span></h2>
      <div class="body" id="desk"></div>
    </section>
  </div>
</div>

<div class="intro" id="intro" role="dialog" aria-modal="true" aria-labelledby="introTitle">
  <div class="card" id="card"></div>
</div>

<script>
'use strict';
{
const NS = 'http://www.w3.org/2000/svg';
const COL = {NORMAL: '#3DDC84', SALDIRI: '#FF9F1C', KONTROL: '#3EC6E0', ALARM: '#FF4D3D'};
const FLOW_IN = 1.3, FLOW_OUT = 1.0;      // boruda yolculuk süreleri (sunum sn)
const MAX_SPAWN = 30, RECENT = 5, INTRO_MS = 4200;
const BK = {x: 470, y: 250};               // Bekçi ünitesi
const OUT = {NORMAL: [[530, 250], [800, 250]], SALDIRI: [[470, 305], [470, 430], [640, 430]],
             ALARM: [[470, 195], [470, 70], [640, 70]], KONTROL: [[470, 195], [470, 70], [640, 70]]};
const VERD = {
  unseen: [['saldiri_onay', 'Saldırı · onayla', 'pri', 'Onaylandı · yeni saldırı ailesi olarak kaydedildi'],
           ['yanlis_alarm', 'Yanlış alarm', '', 'Yanlış alarm · geri bildirim kaydedildi']],
  newdev: [['cihaz_tanit', 'Cihazı tanıt', 'ok', 'Cihaz tanıtıldı · trafiği sonraki eğitime normal olarak eklenecek'],
           ['engelle', 'Engelle', 'pri', 'Cihaz engellendi · ağ yöneticisine bildirildi']],
  other:  [['yanlis_alarm', 'Normal · yanlış alarm', 'ok', 'Yanlış alarm · geri bildirim kaydedildi'],
           ['saldiri_onay', 'Saldırı · onayla', 'pri', 'Onaylandı · saldırı olarak kaydedildi']]};

const $ = (id) => document.getElementById(id);
function el(tag, at, parent) { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); if (parent) parent.appendChild(e); return e; }
function txt(tag, at, s, parent) { const e = el(tag, at, parent); e.textContent = s; return e; }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c])); }
function pct(x, d = 1) { return '%' + (100 * x).toFixed(d).replace('.', ','); }
function nf(n) { return Number(n).toLocaleString('tr-TR'); }
function mmss(t) { const s = Math.max(0, Math.floor(t)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
function dur(sec) { if (sec < 90) return Math.round(sec) + ' sn'; if (sec < 5400) return Math.round(sec / 60) + ' dk'; if (sec < 172800) return Math.round(sec / 3600) + ' sa'; return Math.round(sec / 86400) + ' gün'; }
function hash(i) { let x = ((i + 1) * 2654435761) % 4294967296; x ^= x >>> 13; x = (x * 1274126177) % 4294967296; return (x >>> 0) / 4294967296; }
function lb(arr, t) { let lo = 0, hi = arr.length; while (lo < hi) { const m = (lo + hi) >> 1; if (arr[m] < t) lo = m + 1; else hi = m; } return lo; }
function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }

const S = {data: null, clock: 0, playing: true, speed: 1, pIdx: 0, cIdx: 0, items: [], recent: [], log: [],
           nodes: {}, tags: {}, verdicts: {}, scene: -1, deskKey: null, needle: 150, jit: 0, intro: null, skipIntro: null};

async function load() {
  try {
    if (window.BEKCI_SAMPLE) { S.data = window.BEKCI_SAMPLE; S.preview = true; }
    else {
      const runs = await (await fetch('/api/runs')).json();
      if (!runs.length) throw new Error('Veritabanında oynatma yok. Önce: python src/demo/replay_dnn_edgeiiot.py … --db');
      const want = new URLSearchParams(location.search).get('run');
      const run = want ? runs.find((r) => String(r.id) === want) : runs[0];
      if (!run) throw new Error('Oynatma bulunamadı: ' + want);
      const r = await fetch(`/api/runs/${run.id}/timeline`);
      if (!r.ok) throw new Error('Zaman çizelgesi alınamadı: ' + r.status);
      S.data = await r.json();
    }
    setup();
    requestAnimationFrame(frame);
  } catch (e) { $('error').style.display = 'block'; $('error').textContent = e.message; $('runInfo').textContent = ''; }
}

// ------------------------------------------------------------------ kurulum
function setup() {
  const D = S.data;
  D.packets.n = D.packets.t.length;
  D.connT = D.connections.map((c) => c.t);
  $('runInfo').innerHTML = `OYNATMA ${esc(D.run.id)} · MODELİN HİÇ GÖRMEDİĞİ AİLE: <b>${esc(D.run.unseen_family)}</b>` +
    (S.preview ? ' · <span style="color:var(--haz)">ÖNİZLEME · SENTETİK VERİ, SAYILAR GERÇEK DEĞİL</span>' : '');

// ------------------------------------------------------------------ zaman
function sceneAt(t) { const sc = S.data.scenes; for (let k = sc.length - 1; k >= 0; k--) if (t >= sc[k].start) return k; return 0; }

function jump(k, intro) {
  const D = S.data, t = D.scenes[k].start + 0.001;
  S.clock = t; S.pIdx = lb(D.packets.t, t); S.cIdx = lb(D.connT, t);
  S.items = []; S.recent = [];
  S.log = D.connections.slice(Math.max(0, S.cIdx - 8), S.cIdx).reverse();
  S.scene = -1; S.deskKey = null;
  S.skipIntro = intro ? null : k;
  render();
}

function counters(t) {
  const D = S.data; let pk = 0, blk = 0, an = 0;
  D.scenes.forEach((sc) => { if (t >= sc.end) { pk += sc.total; blk += sc.conn.blocked; an += sc.conn.to_analyst; } });
  const k = sceneAt(t), sc = D.scenes[k], sb = {blk: 0, an: 0};
  if (t < sc.end) {
    pk += Math.round((lb(D.packets.t, t) - lb(D.packets.t, sc.start)) * sc.pktScale);
    let b = 0, a = 0;
    for (let i = lb(D.connT, sc.start), e = lb(D.connT, t); i < e; i++) { const c = D.connections[i]; if (c.blocked) b++; if (c.to_analyst) a++; }
    sb.blk = Math.round(b * sc.blkScale); sb.an = a; blk += sb.blk; an += a;
  }
  return {pk, blk, an, sb};
}

function pathPoint(pts, q) {
  const seg = []; let L = 0;
  for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(l); L += l; }
  let d = clamp(q, 0, 1) * L;
  for (let i = 0; i < seg.length; i++) {
    if (d <= seg[i] || i === seg.length - 1) { const f = seg[i] ? Math.min(1, d / seg[i]) : 0; return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * f, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * f]; }
    d -= seg[i];
  }
  return pts[pts.length - 1];
}

function dialAngle(i) {
  const P = S.data.packets, d = P.decision[i];
  if (d === 'NORMAL') return 172 - 40 * clamp(1 + (P.guard_margin[i] ?? -1) / 3, 0, 1);
  if (d === 'KONTROL') return 118 - 16 * clamp((P.guard_margin[i] ?? 0) / 3, 0, 1);
  if (d === 'SALDIRI') return 95 - 40 * hash(i);
  return 46 - 42 * clamp((P.alarm_margin[i] ?? 0) / 4, 0, 1);
}

let last = null;
function frame(now) {
  const D = S.data;
  if (last == null) last = now;
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (S.playing && !S.intro) {
    S.clock += dt * S.speed;
    if (S.clock >= D.duration) jump(0, true);
    let spawned = 0;
    while (S.pIdx < D.packets.n && D.packets.t[S.pIdx] <= S.clock) {
      const i = S.pIdx++, dec = D.packets.decision[i];
      S.recent.push({t: D.packets.t[i], d: dec, a: dialAngle(i)});
      if (dec === 'NORMAL' && spawned >= MAX_SPAWN) continue;
      spawned++;
      S.items.push({i, born: S.clock, path: S.nodes[D.packets.source_id[i]] || [[150, 440], [330, 440], [330, BK.y], [BK.x - 62, BK.y]]});
    }
    while (S.cIdx < D.connections.length && D.connT[S.cIdx] <= S.clock) { S.log.unshift(D.connections[S.cIdx++]); S.log.length = Math.min(S.log.length, 8); }
    S.items = S.items.filter((it) => S.clock - it.born < FLOW_IN + FLOW_OUT);
    S.recent = S.recent.filter((r) => r.t > S.clock - RECENT);
  }
  render();
  requestAnimationFrame(frame);
}

// ------------------------------------------------------------------ çizim
function render() {
  const D = S.data, k = sceneAt(S.clock), sc = D.scenes[k];
  $('clock').textContent = `senaryo ${mmss(S.clock)} / ${mmss(D.duration)}`;
  $('prog').style.width = (S.clock / D.duration * 100).toFixed(2) + '%';
  const c = counters(S.clock);
  $('nPkt').textContent = nf(c.pk); $('nBlk').textContent = nf(c.blk); $('nAn').textContent = nf(c.an);
  if (k !== S.scene) { S.scene = k; drawScene(k); }
  const G = S.pkt; while (G.firstChild) G.removeChild(G.firstChild);
  let coreCol = null;
  for (const it of S.items) {
    const age = S.clock - it.born, dec = D.packets.decision[it.i];
    let xy;
    if (age < FLOW_IN) xy = pathPoint(it.path, age / FLOW_IN);
    else { xy = pathPoint([[BK.x, BK.y], ...OUT[dec]], (age - FLOW_IN) / FLOW_OUT); if (age - FLOW_IN < .25 && (!coreCol || dec !== 'NORMAL')) coreCol = COL[dec]; }
    const big = dec !== 'NORMAL';
    if (big) el('circle', {cx: xy[0], cy: xy[1], r: 9, fill: COL[dec], opacity: .25}, G);
    el('circle', {cx: xy[0], cy: xy[1], r: big ? 4.6 : 3.2, fill: age < FLOW_IN && !big ? '#9FE9C0' : COL[dec]}, G);
  }
  S.core.setAttribute('fill', coreCol || '#0f1214');
  const lvl = sc.conn.blocked ? c.sb.blk / sc.conn.blocked : 0;
  S.tank.setAttribute('height', (96 * lvl).toFixed(1)); S.tank.setAttribute('y', (478 - 96 * lvl).toFixed(1));
  S.tankTxt.textContent = nf(c.sb.blk); S.anTxt.textContent = nf(c.sb.an);
  S.anLamp.setAttribute('fill', c.sb.an ? (Math.floor(S.clock * 2) % 2 ? '#FF4D3D' : '#5a1d17') : '#3a1512');
  drawDial(); drawAnn(k); drawLog(); drawDesk(k);
}

function drawScene(k) {
  const D = S.data, sc = D.scenes[k], sp = sc.sources.find((s) => s.role === sc.key);
  D.scenes.forEach((s, i) => { s.btn.className = 'scn' + (i === k ? ' on' : i < k ? ' done' : ''); });
  S.extGroup.setAttribute('opacity', (sc.key === 'known' || sc.key === 'unseen') && sp ? 1 : 0);
  if (S.extLabel) {
    S.extLabel.textContent = (sc.key === 'unseen' ? 'GÖRÜLMEMİŞ · ' : 'BİLİNEN · ') + (sp ? sp.name.toUpperCase() : '');
    S.extLabel.setAttribute('fill', sc.key === 'unseen' ? '#FF4D3D' : '#FF9F1C');
  }
  S.newGroup.setAttribute('opacity', sc.key === 'newdev' && sp ? 1 : 0);
  $('compress').textContent = 'Kayıt zamanı sıkıştırıldı (paket sırası ve kararlar aynı): ' +

  if (S.skipIntro === k) { S.skipIntro = null; return; }
  showIntro(k);
}

  if (sc.key === 'unseen') return {col: '#FF4D3D', title: `Hiç görülmemiş saldırı · ${nm}`,
    body: `Model ${esc(D.run.unseen_family)} ailesini hiç görmedi. Bir kısmını bildiği bir saldırıya benzetip yine durduruyor; geri kalanında tahmin uydurmak yerine "tanımıyorum" diyor ve analiste soruyor.${none}`,
    facts: [[nf(c.blocked), 'bilinen saldırıya benzetip durdurdu'], [nf(c.to_analyst), '"tanımıyorum" · analiste'], [nf(c.blocked_and_analyst), 'ikisi birden']]};
  const modbus = /modbus/i.test(nm) ? ' Eğitim verisindeki 1,6 milyon normal satırın yalnız 150\'si Modbus.' : '';
  return {col: '#3EC6E0', title: `Ağa yeni bir cihaz katıldı · ${nm}`,
    body: `Saldırı değil, ama model bu cihazın trafiğini tanımıyor.${modbus} Bekçi tahmin uydurmuyor; tanımadığı cihazı analiste soruyor. Kayma göstergesi burada devreye giriyor.${none}`,
    facts: [[sp ? nf(sp.n_packets) : '0', 'cihaz paketi'], [nf(c.to_analyst), 'bağlantı analiste'], [pct(share, 1), 'analist yükü']]};
}

function showIntro(k) {
  const t = sceneText(k);
  $('card').style.setProperty('--c', t.col);
  $('card').innerHTML = `<div class="hazard"></div><div class="in"><div class="num">${k + 1}</div><div><h1 id="introTitle">${t.title}</h1><p>${t.body}</p></div>
    <div class="facts">${t.facts.map(([n, l]) => `<div><div class="n">${n}</div><div class="t">${l}</div></div>`).join('')}</div>
    <div class="go"><div class="bar"><i id="introBar"></i></div><span>tıkla ya da Enter · kontrol odasına geç</span></div></div>`;
  $('intro').className = 'intro on';
  S.intro = {start: performance.now()};
  const tick = () => {
    if (!S.intro) return;
    const q = (performance.now() - S.intro.start) / INTRO_MS;
    const b = $('introBar'); if (b) b.style.width = Math.min(100, q * 100) + '%';
    if (q >= 1) closeIntro(); else requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
function closeIntro() { if (!S.intro) return; S.intro = null; $('intro').className = 'intro'; last = null; }

function drawDial() {
  const R = S.recent;
  if (R.length) {
    let sw = 0, sa = 0;
    for (const r of R) { const w = (r.d === 'NORMAL' ? 1 : 6) * (0.4 + 0.6 * (1 - (S.clock - r.t) / RECENT)); sw += w; sa += w * r.a; }
    S.needle += (sa / sw - S.needle) * 0.08;
  }
  S.needle = clamp(S.needle, 2, 178);
  S.jit = S.jit * 0.8 + (Math.random() - 0.5) * 0.6;
  const ang = S.needle + S.jit;
  S.needleEl.setAttribute('transform', `rotate(${(90 - ang).toFixed(2)} 200 200)`);
  const cnt = {NORMAL: 0, SALDIRI: 0, KONTROL: 0, ALARM: 0}; R.forEach((r) => { cnt[r.d]++; });
  const n = R.length || 1;
  $('mix').innerHTML = ['NORMAL', 'KONTROL', 'SALDIRI', 'ALARM'].map((d) => `<i style="width:${(cnt[d] / n * 100).toFixed(2)}%;background:${COL[d]}"></i>`).join('');
  $('mixTxt').textContent = `son 5 sn · ${nf(R.length)} paket · normal ${pct(cnt.NORMAL / n, 0)} · emin değil ${pct(cnt.KONTROL / n, 0)} · bilinen ${pct(cnt.SALDIRI / n, 0)} · tanımıyor ${pct(cnt.ALARM / n, 0)}`;
  const st = ang > 120 ? ['TANIDIK · NORMAL', '#3DDC84'] : ang > 100 ? ['EMİN DEĞİL', '#3EC6E0'] : ang > 50 ? ['TANIDIK · SALDIRI', '#FF9F1C'] : ['TANIMIYORUM', '#FF4D3D'];
  S.dialTxt.textContent = st[0]; S.dialTxt.setAttribute('fill', st[1]);
}

function drawAnn(k) {
  const D = S.data, R = S.recent, dr = D.drift.series[clamp(Math.floor(S.clock), 0, D.drift.series.length - 1)];
  const has = (d) => R.some((r) => r.d === d);
  const queue = D.alerts.some((a) => a.scene === k && a.t <= S.clock && !(S.verdicts[a.id] || (a.status && a.status !== 'acik')));
  const st = {known: has('SALDIRI'), alarm: has('ALARM'), check: has('KONTROL'), queue,
              load: dr.alert_rate > D.drift.alert_hi, novel: dr.novel_share > D.drift.novel_hi,
              newdev: D.scenes[k].key === 'newdev' && D.scenes[k].has_special, drift: dr.warn};
  for (const [key] of LAMPS) $('L-' + key).className = 'lamp' + (st[key] ? ' on' + (['alarm', 'queue', 'drift'].includes(key) ? ' flash' : '') : '');
  $('gA').style.width = clamp(dr.alert_rate * 200, 0, 100) + '%'; $('vA').textContent = pct(dr.alert_rate);
  $('gN').style.width = clamp(dr.novel_share * 200, 0, 100) + '%'; $('vN').textContent = pct(dr.novel_share);
  $('hz').className = 'hazard' + (dr.warn ? ' anim' : '');
  S.warnTxt.setAttribute('opacity', dr.warn ? 1 : 0);
}

function drawLog() {
  const msg = (c) => c.outcome === 'ALARM' ? (c.blocked ? 'tanımadı · karantina + analist' : 'tanımadı · analiste')
    : c.outcome === 'KONTROL' ? 'emin değil · analiste' : c.outcome === 'SALDIRI' ? 'bilinen saldırı · karantina' + (c.pred ? ' (' + c.pred + ')' : '') : 'akış normal';
  const state = (c) => c.outcome === 'NORMAL' ? 'NORMAL' : c.outcome === 'SALDIRI' ? 'ENGELLENDİ' : 'İNCELEME';
  const rows = S.log.map((c) => `<div style="--c:${COL[c.outcome]}"><span>${mmss(c.t)}</span><span>${esc(S.tags[c.source_id] || '')}</span>` +
    `<span title="${esc(c.src)} ↔ ${esc(c.dst)}">${esc(msg(c))} · ${esc(c.src || 'paket')}</span><span class="st">${state(c)}</span></div>`).join('');
  $('log').innerHTML = rows || '<div style="--c:#3a434b"><span>--:--</span><span></span><span>kayıt bekleniyor</span><span class="st"></span></div>';
}

function drawDesk(k) {
  const D = S.data, sc = D.scenes[k];
  const open = D.alerts.filter((a) => a.scene === k && a.t <= S.clock), a = open[open.length - 1];
  const key = (a ? a.id + ':' + (S.verdicts[a.id] || a.status) : 'none') + ':' + k + ':' + open.length;
  if (key === S.deskKey) return;
  S.deskKey = key;
  $('woCount').textContent = `bu sahnede ${nf(open.length)} / ${nf(sc.conn.to_analyst)} iş emri`;
  if (!a) {
    $('desk').innerHTML = `<div class="wo" style="--c:#3DDC84"><div class="hd"><span class="badge">SAKİN</span><span class="mono" style="color:var(--mute)">açık iş emri yok</span></div>
      <h3>Konsol sakin</h3><p>Bekçi boş paketlere verdiği şüpheyi tek başına alarm saymıyor; yalnız içerik taşıyan şüpheli bağlantılar buraya gelir. Bilinen saldırılar karantinaya kendiliğinden gider.</p></div>`;
    return;
  }
  const role = a.role === 'unseen' ? 'unseen' : a.role === 'newdev' ? 'newdev' : 'other';
  const done = VERD[role].find((v) => v[0] === (S.verdicts[a.id] || a.status));
  const head = role === 'newdev' ? ['KAYITSIZ CİHAZ', '"Bu cihazı hiç görmedim, sence ne?"', '#3EC6E0']
    : a.outcome === 'ALARM' ? ['TANIMIYOR', '"Bu bağlantıyı tanımıyorum."', '#FF4D3D'] : ['EMİN DEĞİL', '"Normal dedim ama emin değilim."', '#3EC6E0'];
  const why = a.outcome === 'ALARM' ? 'TabM üyeleri anlaşamadı: anlaşmazlık, bilinen trafikteki eşiği aştı.' : 'Normal tahmin edildi ama enerji, kontrol eşiğinin üstünde.';
  $('desk').innerHTML = `<div class="wo" style="--c:${head[2]}"><div class="hd"><span class="badge">${head[0]}</span>${a.blocked ? '<span class="badge" style="--c:#FF9F1C">AYRICA KARANTİNADA</span>' : ''}
      <span class="mono" style="color:var(--ink2)">${esc(a.src || '')} ↔ ${esc(a.dst || '')}</span>${done ? '' : '<span class="blink" style="width:9px;height:9px;border-radius:50%;background:var(--c)"></span>'}</div>
    <h3>${head[1]}</h3><p>${why}</p>
    <div class="kv"><div><div class="n">${nf(a.n_packets)}</div><div class="t">paket</div></div><div><div class="n">${nf(a.n_content)}</div><div class="t">içerik taşıyan</div></div>
      <div><div class="n" style="color:var(--alm)">${nf(a.n_alarm)}</div><div class="t">alarm paketi</div></div><div><div class="n" style="color:var(--chk)">${nf(a.n_kontrol)}</div><div class="t">kontrol paketi</div></div></div>
    <div class="xai"><div><b>Neden? · XAI-2</b>${a.explanation ? esc(JSON.stringify(a.explanation)) : 'Gerçek Shapley değerleri #15 adımında.'}</div><div><b>Kaçabilir miydi? · XAI-3</b>Karşı-olgusal açıklama #15 adımında.</div></div>
    ${done ? `<div class="done">✓ ${done[3]}</div>` : `<div class="acts">${VERD[role].map((v) => `<button class="act ${v[2]}" data-v="${v[0]}">${v[1]}</button>`).join('')}</div>`}</div>`;
  $('desk').querySelectorAll('button[data-v]').forEach((b) => { b.onclick = () => decide(a, b.dataset.v); });
}

async function decide(a, status) {
  S.verdicts[a.id] = status; S.deskKey = null;
  if (S.preview) return;
  try {
    const r = await fetch(`/api/alerts/${a.id}`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({status})});
    if (!r.ok) throw new Error(r.status);
    a.status = status;
  } catch (e) { delete S.verdicts[a.id]; S.deskKey = null; $('error').style.display = 'block'; $('error').textContent = 'Karar kaydedilemedi: ' + e.message; }
}

window.__bekci = {S, jump, decide, closeIntro};
load();
}
</script>
